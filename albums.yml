# Music page data — edit albums + playlist URL here.
# Each album needs artist and title. tidal_url is optional: when omitted the
# page links to a Tidal search for "<artist> <title>". Set it explicitly to
# point somewhere else (e.g. Bandcamp). cover_url is an optional art override.
#
# Cover art is auto-fetched from the iTunes Search API and cached in
# images/albums/<slug>.jpg, where slug = lowercased "<artist> <title>" with
# every run of non-alphanumerics collapsed to "-". A cached file is reused as
# is, so renaming an artist/title re-fetches under the new slug.
#
# mockup_count: if > 0, ignore the `albums:` list and pull that many random
# covers from the iTunes top-albums charts. Set to 0 to use the real list.

mockup_count: 0

# No real playlist yet. Leave empty to suppress the button; fill in a real
